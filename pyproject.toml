[project]
name = "hospital-ai-assistant"
version = "0.1.0"
description = "Local hospital AI assistant prototype for referral preparation and guideline RAG demos."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.1",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
  "pypdfium2>=4.30.0",
  "pytesseract>=0.3.13",
  "reportlab>=4.2.0",
  "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]
local_models = [
  "sentence-transformers>=3.0.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0"
]
local-embeddings = [
  "sentence-transformers>=3.0.0",
  "torch>=2.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
