services:
  backend:
    environment:
      MODEL_PROVIDER: gemma_vllm
      LOCAL_LLM_BASE_URL: http://model-server:8080/v1
      LOCAL_LLM_ALLOWED_HOSTS: localhost,127.0.0.1,model-server,host.docker.internal
      GENERATION_MODEL_ID: ${GENERATION_MODEL_ID:-google/gemma-4-31B-it}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lexical_only}
      NO_EXTERNAL_AI_CALLS: "true"
    depends_on:
      model-server:
        condition: service_started

  model-server:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.8.5}
    command: >
      --model ${LOCAL_MODEL_PATH:-/models/gemma-local}
      --served-model-name ${GENERATION_MODEL_ID:-google/gemma-4-31B-it}
      --host 0.0.0.0
      --port 8080
    environment:
      HF_HOME: /models
    volumes:
      - ./data/models:/models
    ports: ["8080:8080"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
