name: CI

on:
  push:
  pull_request:

jobs:
  backend-lint-and-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check runtime
        run: python scripts/check_runtime.py

      - name: Compile Python
        run: python -m compileall -q backend scripts demos tests

      - name: Lint Python
        run: python -m ruff check backend tests scripts demos

      - name: Unit tests
        run: python -m pytest -q tests/unit

      - name: Security tests
        run: python -m pytest -q tests/security

      - name: Integration tests
        run: python -m pytest -q tests/integration

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund

      - name: Frontend build
        run: npm --prefix frontend run build

  synthetic-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify committed referral demo PDFs
        run: |
          test -f demos/referral_inbox_samples/001_kardiologie_complete_referral.pdf
          test -f demos/referral_inbox_samples/002_innere_medizin_missing_phone_scan.pdf

      - name: Evaluate referrals
        run: |
          MODEL_PROVIDER=test_double \
          EMBEDDING_PROVIDER=test_double \
          DATABASE_URL=sqlite:///./prototype_eval_referrals.db \
          python scripts/evaluate_referrals.py

      - name: Evaluate guidelines
        run: |
          MODEL_PROVIDER=test_double \
          EMBEDDING_PROVIDER=test_double \
          DATABASE_URL=sqlite:///./prototype_eval_guidelines.db \
          python scripts/evaluate_guidelines.py
